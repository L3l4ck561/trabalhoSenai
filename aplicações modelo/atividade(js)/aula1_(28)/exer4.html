<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //4 - Crie um algoritmo que leia a idade de uma pessoa e
        //calcule quantos dias ela viveu e exiba uma mensagem
        //no console dizendo: “Você já viveu valordias dias nessa
        //terra”.

        let idade = prompt("digite sua idade: "),
        valordias = idade * 365.25;

        console.log(`Você já viveu ${valordias} dias nessa terra`)
    </script>
</body>
</html>
