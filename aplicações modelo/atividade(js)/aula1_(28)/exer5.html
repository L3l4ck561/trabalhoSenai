<body>
    <script>
        //5 – Crie um algoritmo que ao receber 3 notas, calcule a
        //média e exiba as notas no console com uma mensagem
        //falando da média das notas.

        let nota1 = parseFloat(prompt("Digite sua 1ª nota: ")),
            nota2 = parseFloat(prompt("Digite sua 2ª nota: ")),
            nota3 = parseFloat(prompt("Digite sua 3ª nota: "));

        let media = (nota1 + nota2 + nota3) / 3

        console.log("a média das 3 notas é igual a: ", media)
    </script>
