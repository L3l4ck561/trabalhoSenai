<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //7 – Calcule o valor do delta da equação do 2o grau com
        //os valores informados pelo usuário e exiba o resultado
        //como um pop-up.

        let a = parseFloat(prompt("digite o valor de 'a': ")),
            b = parseFloat(prompt("digite o valor de 'b': ")),
            c = parseFloat(prompt("digite o valor de 'c': "));

        let delta = b**2 - (4*a*c)

        alert("o resultado do delta é: " + delta)
    </script>
</body>
</html>
