<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Papyro - Editar Leitor</title>
    <link rel="shortcut icon" href="../static/bookshelf_icon-icons.com_54414.ico" type="image/x-icon">

    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap');
      *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body{
        background-color: bisque ;
        background-size: cover;
      }

      #Papyro{
        color: brown;
        font-family: "Dancing Script";
        font-size: 30px;
      }

      .container-fluid{    
        background-color:rgb(255, 149, 0);
        margin-top: -10px;
      }

      #button{
        color: white;
        background-color: rgb(219, 140, 14);
        margin: 3px;
        border-radius: 10px;
      }

      form{
        background-color: rgb(255, 149, 0);
        margin: 10px;
        border-radius: 10px;
      }

      h3{
        font-family:cursive;
        color: white;
      }

      #button2{
        color: white;
        background-color: rgb(232, 81, 81);
        margin: 3px;
        border-radius: 10px;
        transition: background-color 0.5s;
      }
      #button2:hover{
        background-color: rgb(191, 8, 8);
      }
      .dropdown-item{
        background-color: antiquewhite;
        color:brown;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      }

      .dropdown-menu{
        background-color: rgb(255, 191, 0);
      }

      #img{
        text-align: right;
        margin-right: -100px;
        margin-top: -30px;
      }

    </style>
  </head>
  <body style="background-image: url('../static/authentic-book-club-scene.jpg');width: 100%;">
    
    <!-- Menu de navegação -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a id="Papyro" class="navbar-brand text-uppercase fw-bold" href="/">Papyro</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">

              <li class="nav-item">
                <a style="font-style: italic;" class="nav-link" href="/">Início</a>
              </li>

              <li class="nav-item dropdown">
                <a id="button" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Livro
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="/cadastrar-livro">Cadastrar</a></li>
                  <li><a class="dropdown-item" href="/listar-livro">Listar</a></li>
                </ul>
              </li>

              <li class="nav-item dropdown">
                <a id="button" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Leitor
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="/cadastrar-leitor">Cadastrar</a></li>
                  <li><a class="dropdown-item" href="/listar-leitor">Listar</a></li>
                </ul>
              </li>

              <li class="nav-item dropdown">
                <a id="button" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Empréstimo
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="/realizar-emprestimo">Realizar</a></li>
                  <li><a class="dropdown-item" href="/listar-emprestimo">Listar</a></li>
                </ul>
              </li>

            </ul>
          </div>
        </div>
    </nav>

    <!-- Painel principal -->
    <main class="container mt-5">

        <h3 class="text-center">Editar Leitor</h3>

        <form class="col-6 border mx-auto p-5 mt-3" action="/editar-leitor" method="post">
            <div class="mb-3">
                <label for="cpf" class="form-label"><b>CPF</b></label>
                <input type="text" class="form-control" id="cpf" name="cpf" value="{{ leitor[0] }}" readonly>
            </div>

            <div class="mb-3">
                <label for="nome" class="form-label"><b>Nome</b></label>
                <input type="text" class="form-control" id="nome" name="nome" value="{{ leitor[1] }}" required>
            </div>

            <div class="mb-3">
                <label for="endereco" class="form-label"><b>Endereço</b></label>
                <input type="text" class="form-control" id="endereco" name="endereco" value="{{ leitor[2] }}" required>
            </div>

            <div class="mb-3">
                <label for="telefone" class="form-label"><b>Telefone</b></label>
                <input type="text" class="form-control" id="telefone" name="telefone" value="{{ leitor[3] }}" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label"><b>E-mail</b></label>
                <input type="text" class="form-control" id="email" name="email" value="{{ leitor[4] }}" required>
            </div>

            <div class="mb-3">
                <button id="button2" type="submit" class="btn btn-success">Salvar</button>
            </div>

        </form>
        <div id="img">
          <img src="../static/pilha-de-livros.png" alt="" width="100px">
          </div>
    </main>

    <!-- Java Script do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
