<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Busca de Usuário - Academia</title>
    <!-- Link para o CSS do Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Cadastro de Usuário para Academia</h1>

        <!-- Formulário de Cadastro -->
        <form action="/cadastrar" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome completo" required>
            </div>

            <div class="form-group">
                <label for="nome_usuario">Nome de Usuário:</label>
                <input type="text" class="form-control" id="nome_usuario" name="nome_usuario" placeholder="Digite o nome de usuário" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Digite o email" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite a senha" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="Digite o telefone">
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" class="form-control" id="data_nascimento" name="data_nascimento">
            </div>

            <div class="form-group">
                <label for="foto_perfil">Foto de Perfil:</label>
                <input type="file" class="form-control-file" id="foto_perfil" name="foto_perfil" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
        </form>

        <!-- Formulário de Busca -->
        <div class="text-center mt-5">
            <h2>Buscar Usuário por Nome de Usuário</h2>
            <form action="/buscar_usuario" method="POST">
                <div class="form-group">
                    <label for="busca_nome_usuario">Nome de Usuário:</label>
                    <input type="text" class="form-control" id="busca_nome_usuario" name="busca_nome_usuario" placeholder="Digite o nome de usuário para buscar" required>
                </div>
                <button type="submit" class="btn btn-secondary btn-block">Buscar Usuário</button>
            </form>

            <!-- Opções de Download após a Busca -->
            <div id="downloadOptions" style="display: none;">
                <h2>Opções de Download</h2>
                <a href="#" id="downloadBinaryLink" class="btn btn-secondary mt-2">Baixar Código Binário (.txt)</a>
                <a href="#" id="downloadImageLink" class="btn btn-info mt-2">Baixar Imagem Original</a>
            </div>
        </div>
    </div>

    <!-- Scripts do Bootstrap e JavaScript para exibir opções de download -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // Verifica se o usuário foi encontrado após a busca e exibe os links de download
            const queryParams = new URLSearchParams(window.location.search);
            const usuarioEncontrado = queryParams.get("usuario_encontrado");
            const usuarioNome = queryParams.get("nome_usuario");

            if (usuarioEncontrado === "true") {
                $('#downloadOptions').show();
                $('#downloadBinaryLink').attr('href', `/download_binary?nome_usuario=${usuarioNome}`);
                $('#downloadImageLink').attr('href', `/download_image?nome_usuario=${usuarioNome}`);
            }
        });
    </script>
</body>
</html>
