<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Página</title>
    <script>
        function imprimirPagina() {
            window.print();
        }
    </script>
</head>
<body>
    <h1>Bem-vindo à Minha Página</h1>
    <p>Este é um exemplo de uma página que pode ser impressa.</p>
    
    <button onclick="imprimirPagina()">Imprimir Página</button>
</body>
</html>
