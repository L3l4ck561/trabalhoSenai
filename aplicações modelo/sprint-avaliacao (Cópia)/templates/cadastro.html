<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
     <link rel="stylesheet"href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home" />
     <title>Login_cadastro</title>
</head>
<body>
    <div id="topo"></div>
    <header class="header">
        <a href="/">
            <div class="logo">GameStream</div>
        </a>
        <div class="user-menu">
            <a href="/login"><button class="btn">Sing in</button></a>
        </div>
    </header>
    <div id="img"><a href="/"><img width="30px"
                src="static/home_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.png" alt=""></a></div>
    
    <div class="fixed"><a href="#topo"><img width="30px" src="static/vertical_align_top_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.png"alt=""></a></div>

    <main class="main-content">
        <form class="card" action="/validar-cadastro" method="post">
        <div class="login-content"> 
                <input type="text" class="input-login" placeholder="   Nome de usuário:" name="nome" required>
                <br><br>
                <input type="email" class="input-login" placeholder="   Email:" name="email" required>
                <br><br>
                <label style="color: #888;" for="date">Data de Nascimento:</label>
                <input class="input-login" name="nascimento" type="date" required>
                <br><br>
                <input class="input-login" type="password" name="senha" placeholder="   Senha:" required>
                <div><button class="btn" id="btn" type="submit">Next</button></div>
        </div>
        </form>
    </main>
    <footer>
        <p class="footer">
            &copy; 2024 - GameStream
        </p>
     </footer>
</body>
</html>
